name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testler ve paket doğrulama
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Testler
        run: pnpm test

      # Sırlar veya Cloudflare oturumu gerekmez: paketleme yapılır, yayın yapılmaz.
      - name: Worker paketini doğrula
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run
